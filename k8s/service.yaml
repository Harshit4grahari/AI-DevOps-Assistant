apiVersion: v1
kind: Service
metadata:
  name: ai-devops-assistant
  namespace: devops-system
  labels:
    app.kubernetes.io/name: ai-devops-assistant
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: ai-devops-assistant
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-devops-assistant-ingress
  namespace: devops-system
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    - host: devops-assistant.internal.infra
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-devops-assistant
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-devops-assistant-hpa
  namespace: devops-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-devops-assistant
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
