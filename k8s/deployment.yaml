apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-assistant
  namespace: devops-system
  labels:
    app.kubernetes.io/name: ai-devops-assistant
    app.kubernetes.io/component: webhook-engine
    app.kubernetes.io/part-of: platform-engineering
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-devops-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-devops-assistant
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: assistant
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ai-devops-assistant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: devops-assistant-secrets
                  key: GITHUB_WEBHOOK_SECRET
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-assistant-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-assistant-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: ARGOCD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-assistant-secrets
                  key: ARGOCD_AUTH_TOKEN
                  optional: true
            - name: LLM_PROVIDER
              value: "gemini"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
